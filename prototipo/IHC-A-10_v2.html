<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IHC-A-10 v2 (Corregido)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .stepper { display: flex; list-style: none; padding: 0; }
        .step { padding: 10px 20px; background: #eee; margin-right: 5px; border-radius: 4px; border: 2px solid transparent; }
        
        /* CORRECCIÓN: Foco visible inequívoco */
        .step:focus-visible {
            outline: 3px solid #005fcc;
            outline-offset: 2px;
            border-color: #005fcc;
        }
        
        /* El color sigue existiendo, pero ya no es el ÚNICO indicador */
        .step[aria-current="step"] { background: #3498db; color: white; font-weight: bold; border-color: #2980b9; }
        
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
        .content { margin-top: 20px; padding: 20px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Dashboard UX</h1>
    
    <!-- CORRECCIÓN: Región en vivo para anunciar cambios al lector de pantalla -->
    <div aria-live="polite" id="anuncios" class="sr-only"></div>

    <!-- CORRECCIÓN: Roles semánticos y aria-current -->
    <ul class="stepper" role="list">
        <li class="step" role="listitem" aria-current="step" tabindex="0">
            1. Datos <span class="sr-only">(Paso actual)</span>
        </li>
        <li class="step" role="listitem" tabindex="0">2. Checklist</li>
        <li class="step" role="listitem" tabindex="0">3. Finalizar</li>
    </ul>

    <div class="content">
        <h2 id="titulo-paso">Paso 1: Datos del participante</h2>
        <p>Formulario de datos...</p>
        <button onclick="avanzarPaso()">Siguiente</button>
    </div>

    <script>
        function avanzarPaso() {
            const pasos = document.querySelectorAll('.step');
            const anuncios = document.getElementById('anuncios');
            
            // Lógica simple para simular el avance (solo para demostración)
            pasos[0].removeAttribute('aria-current');
            pasos[0].querySelector('.sr-only')?.remove();
            
            pasos[1].setAttribute('aria-current', 'step');
            if(!pasos[1].querySelector('.sr-only')) {
                const span = document.createElement('span');
                span.className = 'sr-only';
                span.innerText = '(Paso actual)';
                pasos[1].appendChild(span);
            }
            pasos[1].focus(); // Mover el foco físicamente

            // CORRECCIÓN: Anunciar el cambio al lector de pantalla
            anuncios.innerText = 'Avanzando al paso 2: Checklist';
            document.getElementById('titulo-paso').innerText = 'Paso 2: Checklist de verificación';
        }
    </script>
</body>
</html>
