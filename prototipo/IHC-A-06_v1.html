<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IHC-A-06 v1 (Fallo)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        button { padding: 15px 30px; font-size: 18px; background: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Resumen del Pedido</h1>
    <p>Total a pagar: $5.50</p>
    <!-- FALLO: Se puede hacer clic múltiples veces -->
    <button onclick="confirmarPedido()">Confirmar Pedido</button>
    <p id="mensaje"></p>

    <script>
        let pedidos = 0;
        function confirmarPedido() {
            // FALLO: No deshabilita el botón, simula latencia pero permite más clics
            setTimeout(() => {
                pedidos++;
                document.getElementById('mensaje').innerText = `¡Pedido confirmado! (Total pedidos: ${pedidos})`;
            }, 2000);
        }
    </script>
</body>
</html>
