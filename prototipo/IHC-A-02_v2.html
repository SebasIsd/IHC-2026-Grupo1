<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IHC-A-02 v2 (Corregido)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .item { border: 1px solid #ccc; padding: 10px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        /* CORRECCIÓN: Foco visible y de alto contraste */
        button:focus-visible, [tabindex="0"]:focus-visible {
            outline: 3px solid #005fcc;
            outline-offset: 2px;
        }
        button { padding: 8px 16px; cursor: pointer; background: #e74c3c; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Mi Pedido</h1>
    <!-- CORRECCIÓN: Contenedor con tabindex para poder devolver el foco -->
    <div id="carrito" tabindex="-1">
        <div class="item">
            <span>Café Americano - $2.00</span>
            <!-- CORRECCIÓN: aria-label y manejo de foco -->
            <button aria-label="Quitar Café Americano del pedido" onclick="eliminarItem(this)">Quitar</button>
        </div>
        <div class="item">
            <span>Sánduche de Pollo - $3.50</span>
            <button aria-label="Quitar Sánduche de Pollo del pedido" onclick="eliminarItem(this)">Quitar</button>
        </div>
    </div>
    <p>Total: $5.50</p>

    <script>
        function eliminarItem(btn) {
            // Simulación de confirmación (Enter/Escape manejado por el navegador en botones, 
            // pero en un caso real usaríamos un modal con focus trap).
            if(confirm('¿Seguro que deseas quitar este ítem?')) {
                const item = btn.parentElement;
                const carrito = document.getElementById('carrito');
                item.remove();
                // CORRECCIÓN: Restaurar foco al contenedor padre
                carrito.focus();
            }
        }
    </script>
</body>
</html>
